<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141e2a"/>
      <stop offset="0.5" stop-color="#0d141d"/>
      <stop offset="1" stop-color="#111d2b"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.25" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.85" cy="0.92" r="0.8">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角渐变背景 -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)" stroke="#2a3c50" stroke-width="5"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glowA)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glowC)"/>

  <!-- 品牌首字母 LA：L 白 / A 琥珀（大字号粗笔画，保证 16px 可辨） -->
  <text x="256" y="392" font-family="Consolas, 'Courier New', monospace" font-size="360" font-weight="900" letter-spacing="8" text-anchor="middle" fill="#f2f7fb">
    <tspan fill="#f2f7fb">L</tspan><tspan fill="#ffb020">A</tspan>
  </text>

  <!-- 终端日志行点缀：一条粗琥珀短杠 -->
  <rect x="172" y="444" width="168" height="22" rx="11" fill="#ffb020"/>
</svg>